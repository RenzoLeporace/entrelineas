name: Verificar EntreLíneas web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar el juego
        run: node tests/gameplay.test.mjs
      - name: Preparar la edición web
        run: node scripts/prepare-web.mjs
      - name: Comprobar el acceso web
        run: node tests/web.test.mjs
